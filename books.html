<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple and clean Book List Manager web application built with HTML, CSS, and Vanilla JavaScript.">
  <title>Book List Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Book List Manager</h1>
    </header>

    <!-- Success/Error Messages -->
    <div id="alert-container"></div>

    <!-- Add Book Form -->
    <form id="book-form">
      <div class="form-group">
        <label for="title">Book Title</label>
        <input type="text" id="title" placeholder="Enter title..." required>
      </div>

      <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" placeholder="Enter author..." required>
      </div>

      <div class="form-group">
        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" placeholder="Enter ISBN..." required>
      </div>

      <div class="form-group">
        <label for="genre">Genre</label>
        <input type="text" id="genre" placeholder="Enter genre..." required>
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" required>
          <option value="Not Read">Not Read</option>
          <option value="Reading">Reading</option>
          <option value="Read">Read</option>
        </select>
      </div>

      <button type="submit" class="btn">Add Book</button>
    </form>

    <!-- Book List Table -->
    <div class="table-wrapper">
      <table id="book-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>ISBN</th>
            <th>Genre</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="book-list">
          <!-- Dynamically populated rows -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- App Script (ES6 Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
