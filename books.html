<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple and clean Book List Manager web application built with HTML, CSS, and Vanilla JavaScript.">
  <title>Book List Manager</title>
  <link rel="stylesheet"
   href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
 
</head>
<body>
  <div class="container">
    <header>
      <h3 class="logo-title">
        <i class="fas fa-book-open"></i>
        Book List Manager
    </h3>

        <button id="logout-btn" class="logout-btn">
    Logout
  </button>
    </header>

    <!-- Success/Error Messages -->
    <div id="alert-container"></div>
    

    <!-- Add Book Form -->
    <form id="book-form">
      <div class="form-group">
        <label for="title">Book Title</label>
        <div class="input-group">
    <i class="fa-regular fa-square-plus"></i>

    <input
        type="text"
        id="title"
        placeholder="Enter title..."
    >
</div>
      </div>

      <div class="form-group">
        <label for="author">Author</label>
        <div class="input-group">
    <i class="fa-regular fa-user"></i>

    <input
        type="text"
        id="author"
        placeholder="Enter author..."
    >
</div>
      </div>

      <div class="form-group">
        <label for="isbn">ISBN</label>
        <div class="input-group">
    <i class="fa-solid fa-barcode"></i>

    <input
        type="text"
        id="isbn"
        placeholder="Enter ISBN..."
    >
</div>
      </div>

      <div class="form-group">
        <label for="genre">Genre</label>
        <div class="input-group">
    <i class="fa-solid fa-tag"></i>

    <input
        type="text"
        id="genre"
        placeholder="Enter genre..."
    >
</div>
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" required>
          <option value="Not Read">Not Read</option>
          <option value="Reading">Reading</option>
          <option value="Read">Read</option>
        </select>
      </div>

      <button type="submit" class="btn">Add Book</button>
    </form>
    <!-- Search Box -->
   <div class="search-container">
      <label for="search">Search Books</label>
      <input
         type="text"
         id="search"
         placeholder="Search by Title, Author, ISBN, Genre or Status..."
      >
   </div>

   <div class="dashboard">

    <div class="card total">
        <div class="icon">📚</div>
        <h3>Total Books</h3>
        <h2 id="total-books">0</h2>
        <p>All Books</p>
    </div>

    <div class="card read">
        <div class="icon green">
    <i class="fas fa-check"></i></div>
        <h3>Books Read</h3>
        <h2 id="read-books">0</h2>
        <p>Completed</p>
    </div>

    <div class="card reading">
        <div class="icon">📖</div>
        <h3>Currently Reading</h3>
        <h2 id="reading-books">0</h2>
        <p>In Progress</p>
    </div>

    <div class="card notread">
        <div class="icon red">
    <i class="fas fa-bookmark"></i>
</div>
        <h3>Not Read</h3>
        <h2 id="notread-books">0</h2>
        <p>Pending</p>
    </div>

    <!-- Progress Card -->

    <div class="progress-card">

        <h3>📈 Reading Progress</h3>

        <div class="progress-content">

             <div class="circle">

    <div id="progress-circle" class="progress-circle">

        <div class="progress-inner">

            <h2 id="progress-percent" class="progress-percent">
                0%
            </h2>

            <p class="progress-text">
                Completed
            </p>

        </div>

    </div>

</div>

            <div class="progress-details">

              <div class="progress-item">

               <span class="label">
                  🟢 Books Read
                </span>

                <span id="progress-read"></span>

              </div>

              <div class="progress-item">

                <span class="label">
                  🟡 In Progress
                </span>

                <span id="progress-reading"></span>

              </div>

              <div class="progress-item">

                <span class="label">
                  🔴 Not Read
                </span>

                <span id="progress-notread"></span>

              </div>

            </div>

        </div>

        <div class="progress-footer">

            Keep going! You're doing great ✨
        
            
        </div>

    </div>

</div>
   


    <!-- Book List Table -->
    <div class="table-wrapper">
      <table id="book-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>ISBN</th>
            <th>Genre</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="book-list">
          <!-- Dynamically populated rows -->
        </tbody>
      </table>
    </div>
  </div>
     <!-- Pagination -->
<div class="pagination">
  <button id="prev-btn">Previous</button>

  <span id="page-info">Page 1 of 1</span>

  <button id="next-btn">Next</button>
</div>

  <!-- App Script (ES6 Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
